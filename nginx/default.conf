server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 50M;

    # Auth for /api/admin/* is enforced by the Express app itself (requireAdmin),
    # which also records every attempt — success and failure — to the audit log
    # with the real username. nginx no longer double-checks credentials here so
    # failed login attempts actually reach that logging code.
    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
